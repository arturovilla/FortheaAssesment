; Alembic configuration for the Forthea backend.
;
; sqlalchemy.url is intentionally blank here — alembic/env.py reads it from
; $DATABASE_URL (loaded from backend/.env.local via python-dotenv) so the same
; URL works for the app, scripts, and migrations.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

; Migration filenames: <rev>_<slug>.py
; We set `revision` manually inside each file (0001, 0002, ...) instead of using
; alembic's default hex hashes — easier to read at a glance for a small project.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
; (none)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
