# Local development stack for the Forthea assessment.
#
# Three services:
#   - db        PostgreSQL, the SQL store for the FastAPI backend
#   - backend   FastAPI (Section 2)
#   - frontend  Next.js dashboard (Section 4), production-style image
#
# Run only db (default workflow during dev — frontend runs via `npm run dev`):
#   docker compose up -d db
#
# Run the full stack as a production-style image:
#   set -a; source frontend/.env.local; set +a
#   docker compose up --build
#
# The `source` step is needed because the frontend's NEXT_PUBLIC_* values
# have to be present in the SHELL environment at build time — compose
# substitutes them into build args and `next build` bakes them into the
# client JS bundle. Without sourcing, the build args fall back to defaults
# and Clerk won't initialise in the browser.

services:
  db:
    image: postgres:16-alpine
    container_name: forthea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: forthea
      POSTGRES_PASSWORD: forthea
      POSTGRES_DB: forthea
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forthea -d forthea"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: forthea-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Inherit Clerk / FRED secrets and any other non-DB config from .env.local;
    # then override the database URLs to use the in-network `db` hostname
    # (the .env.local values point at `localhost` for host-side tools).
    env_file:
      - ./backend/.env.local
    environment:
      DATABASE_URL: postgresql+psycopg://forthea_app:forthea_app@db:5432/forthea
      ADMIN_DATABASE_URL: postgresql+psycopg://forthea:forthea@db:5432/forthea
    ports:
      - "8000:8000"
    # Generated JSON from `docker exec ... python data-generator/datagen.py`
    # stays inside the container at /app/data-generator/output. Use
    # `docker cp forthea-backend:/app/data-generator/output ./data-output`
    # to pull it out when you want to upload via the dashboard.
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: forthea-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values get baked into the client bundle at build
        # time and have to come from the shell environment (see the top of
        # this file). Defaults let the build still succeed if the shell
        # doesn't have them, at the cost of Clerk + API access in the
        # browser.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    # Runtime-only secrets (CLERK_SECRET_KEY etc.) — these aren't baked
    # into the image, they're read by the Next.js server at request time.
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
